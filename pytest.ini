[pytest]
# Custom markers for test categories
markers =
    integration: marks tests that require live API access (deselect with '-m "not integration"')
    slow: marks tests as slow running (deselect with '-m "not slow"')

# By default, skip integration tests unless explicitly requested
# Integration tests have two-layer protection:
#   1. pytest marker: -m "not integration" (default)
#   2. Environment variable: DRIFTSHIELD_LIVE_TESTS=1 (explicit opt-in)
#
# To run only offline tests (default): pytest
# To run integration tests: DRIFTSHIELD_LIVE_TESTS=1 pytest -m integration
# To run all tests including integration: DRIFTSHIELD_LIVE_TESTS=1 pytest -m ""
addopts = -v -m "not integration"
